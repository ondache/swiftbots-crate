[package]
name = "swiftbots"
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = { version = "0.1" }
tower = { version = "0.5", optional = true, features = ["util"] }
http = { version = "1", optional = true }
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.13", optional = true, features = ["json"] }
textwrap = { version = "0.16", optional = true, features = ["unicode-linebreak"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []

basic = [
    "dep:tower",
]
chat = [
    "basic",
    "dep:http",
    "dep:regex",
    "dep:serde_json"
]

telegram = [
    "chat",
    "dep:reqwest",
    "dep:textwrap",
]

full = [
    "basic",
    "chat",
    "telegram",
]

[[example]]
name = "hello_world"
required-features = ["basic"]

[[example]]
name = "chatbot"
required-features = ["chat"]

[[example]]
name = "telegram"
required-features = ["telegram"]

[[example]]
name = "oneshot"
required-features = ["basic"]

[[test]]
name = "basic_bot_test"
required-features = ["basic"]

[[test]]
name = "token_trie_test"
required-features = ["chat"]

[lints.clippy]
redundant_field_names = "allow"
needless_return = "allow"