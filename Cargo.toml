[package]
name = "swiftbots"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
tracing = { version = "0.1" }
async-trait = { version = "0.1" }
tokio = { version = "1", optional = true, features = ["sync", "rt", "time"] }
tower = { version = "0.5", optional = true, features = ["util"] }
http = { version = "1", optional = true }
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.13", optional = true, features = ["json"] }
textwrap = { version = "0.16", optional = true, features = ["unicode-linebreak"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []

rt-tokio = [
    "dep:tokio"
]

event-bot = []

chat = [
    "event-bot",
    "dep:http",
    "dep:regex",
    "dep:serde_json",
    "dep:tower"
]

telegram = [
    "chat",
    "dep:reqwest",
    "dep:textwrap",
]

full = [
    "event-bot",
    "chat",
    "telegram",
    "rt-tokio"
]

[[example]]
name = "hello_world"
required-features = ["event-bot", "rt-tokio"]

[[example]]
name = "chatbot"
required-features = ["chat", "rt-tokio"]

[[example]]
name = "telegram"
required-features = ["telegram", "rt-tokio"]

[[example]]
name = "oneshot"
required-features = ["event-bot", "rt-tokio"]



[[test]]
name = "basic_bot_test"
required-features = ["rt-tokio"]

[[test]]
name = "chat_bot_test"
required-features = ["chat", "rt-tokio"]

[[test]]
name = "event_bot_test"
required-features = ["event-bot", "rt-tokio"]

[[test]]
name = "oneshot_test"
required-features = ["event-bot", "rt-tokio"]

[[test]]
name = "token_trie_test"
required-features = ["chat", "rt-tokio"]

[lints.clippy]
redundant_field_names = "allow"
needless_return = "allow"